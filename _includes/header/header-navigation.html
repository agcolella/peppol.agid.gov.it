{% assign all_menu_pages = site.pages | where: "lang", page.lang | where_exp: "page", "page.order != nil" | sort: "order" %}

<div class="agid-header-overlay py-2">
  <div class="container-fluid px-3 px-lg-4">
    <div class="d-flex align-items-center justify-content-between flex-wrap">
      
      <!-- Logo / Brand -->
      <div class="it-brand-wrapper flex-shrink-0">
        <a href="{{ site.baseurl }}/{{ page.lang }}/" class="d-flex align-items-center text-white text-decoration-none" aria-label="Header - {{ site.data.t.go-home[page.lang] }}" data-proofer-ignore>
          <img class="icon d-block" src="{{ site.baseurl }}{{ site.data.t.logo_header }}" alt="{{ site.name }} logo" style="height: 36px; width: auto;">
        </a>
      </div>

      <!-- Pulsante Hamburger Mobile (Toggle nativo) -->
      <button class="agid-menu-toggler d-lg-none border-0 bg-transparent text-white p-2" type="button" onclick="document.getElementById('agidHeaderNav').classList.toggle('show');" aria-label="Toggle navigation">
        <svg class="icon icon-white" style="width: 28px; height: 28px;">
          <use xlink:href="{{ site.baseurl }}/assets/bootstrap-italia/svg/sprite.svg#it-burger"></use>
        </svg>
      </button>

      <!-- Navigazione Responsiva -->
      <nav id="agidHeaderNav" class="agid-nav-container d-lg-flex align-items-center" aria-label="{{ site.data.t.main-nav[page.lang] }}">
        <ul class="agid-single-line-nav">
          {% for menu_page in all_menu_pages %}
            {% unless menu_page.url == '/it/' or menu_page.title == 'Home' %}
              <li class="nav-item">
                <a class="nav-link" aria-label="{{ site.data.t.goto[page.lang]}} {{ menu_page.title }}" href="{{ site.baseurl }}{{ menu_page.url }}">
                  <span>{{ menu_page.title }}</span>
                </a>
              </li>
            {% endunless %}
          {% endfor %}
        </ul>
      </nav>

    </div>
  </div>
</div>
